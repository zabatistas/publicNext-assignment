spring.application.name=order-management

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/public_db
spring.datasource.username=public_user
spring.datasource.password=publicN3xt!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://public_user:publicN3xt!@localhost:27017/order_events_db?authSource=admin
spring.data.mongodb.database=order_events_db

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers,threaddump,heapdump
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.health.db.enabled=true
management.health.mongo.enabled=true
management.health.redis.enabled=true
management.health.diskspace.enabled=true
management.prometheus.metrics.export.enabled=true
management.info.env.enabled=true

# Application Info
info.app.name=Order Management Service
info.app.description=Order management system with health monitoring
info.app.version=@project.version@
info.app.encoding=@project.build.sourceEncoding@
info.app.java.version=@java.version@
